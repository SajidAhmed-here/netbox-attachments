name: Publish to TestPyPI

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-to-test-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
          python -m pip check

      - name: Run standalone tests
        run: python -m pytest -q

  build:
    name: Build and validate distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine packaging

      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import runpy

          from packaging.version import Version

          version = runpy.run_path("netbox_attachments/version.py")["__version__"]
          tag = os.environ["RELEASE_TAG"]
          if Version(tag) != Version(version):
              raise SystemExit(f"Release tag {tag!r} does not match package version {version!r}")
          PY

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*

      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish distributions to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Configure this repository secret with an API token from test.pypi.org.
      # No repository variables or production PyPI credentials are required.
      - name: Check TestPyPI credentials
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          if [ -z "$TEST_PYPI_API_TOKEN" ]; then
            echo "::error::Set the TEST_PYPI_API_TOKEN repository secret to a TestPyPI API token."
            exit 1
          fi

      - name: Download validated distributions
        uses: actions/download-artifact@v4
        with:
          name: testpypi-distributions
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          # Attestations require Trusted Publishing; this workflow uses an API token.
          attestations: false
